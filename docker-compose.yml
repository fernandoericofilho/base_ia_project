services:
  postgres:
    image: postgres:16-alpine
    container_name: base_project_postgres
    environment:
      POSTGRES_DB: modelo
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - base_project_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d modelo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  base_project_postgres_data:
