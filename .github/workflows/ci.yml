# CI (REGRAS-DO-SISTEMA.md §2.3 e §11, 2026-10-22).
# Regra: CI sempre roda; nenhum teste ou step é desligado para passar. Teste quebrado se corrige.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # `build` inclui `check`: testes unitários, teste de arquitetura e piso de cobertura (70%).
      - name: Build, unit tests, architecture rules and coverage floor
        run: ./gradlew build --no-daemon

      # Postgres real via Testcontainers. O runner ubuntu-latest já tem Docker.
      - name: Integration tests (Postgres via Testcontainers)
        run: ./gradlew integrationTest --no-daemon
